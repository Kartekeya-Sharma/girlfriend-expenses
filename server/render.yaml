services:
  - type: web
    name: expense-tracker-api
    env: node
    buildCommand: |
      cd .. && 
      npm install && 
      cd client && 
      npm install && 
      npm run build && 
      cd ../server && 
      npm install && 
      npm run build
    startCommand: node dist/index.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
